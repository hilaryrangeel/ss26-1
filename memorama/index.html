<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memorama — Elige un Set</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="noise"></div>
  <div class="grid-overlay"></div>

  <a class="back-link" href="../index.html">← Volver</a>

  <div class="page">

    <header>
      <p class="eyebrow">Simulación · 2026-1</p>
      <div class="icon">🃏</div>
      <h1 class="title">Memorama</h1>
      <p class="subtitle">Elige un set de cartas para comenzar</p>
    </header>

    <div class="sets-grid">

      <a class="set-card" href="memorama.html?set=set1">
        <span class="set-num">01</span>
        <div class="card-img-wrap">
          <img src="set1/back.png" alt="Set 1" />
        </div>
        <div class="card-info">
          <h2 class="set-title">Set 1</h2>
          <p class="set-desc">16 pares · Clásico</p>
          <span class="card-cta">Jugar →</span>
        </div>
      </a>

      <a class="set-card" href="memorama.html?set=set2">
        <span class="set-num">02</span>
        <div class="card-img-wrap">
          <img src="set2/back.png" alt="Set 2" />
        </div>
        <div class="card-info">
          <h2 class="set-title">Set 2</h2>
          <p class="set-desc">16 pares · Intermedio</p>
          <span class="card-cta">Jugar →</span>
        </div>
      </a>

      <a class="set-card" href="memorama.html?set=set3">
        <span class="set-num">03</span>
        <div class="card-img-wrap">
          <img src="set3/back.png" alt="Set 3" />
        </div>
        <div class="card-info">
          <h2 class="set-title">Set 3</h2>
          <p class="set-desc">16 pares · Difícil</p>
          <span class="card-cta">Jugar →</span>
        </div>
      </a>

    </div>

  </div>

</body>
</html>
