<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a href="../index.html" class="back-link">← Volver</a>
  <!-- PANTALLA DE NOMBRES -->
  <div id="name-screen">
    <h1># Tic Tac Toe #</h1>
    <p>Ingresa los nombres de los jugadores para comenzar</p>
    <div class="name-fields">
      <div class="name-field">
        <label>✖ Jugador 1</label>
        <input id="name1" type="text" placeholder="Nombre del Jugador 1" maxlength="20">
      </div>
      <div class="name-field">
        <label>⭕ Jugador 2</label>
        <input id="name2" type="text" placeholder="Nombre del Jugador 2" maxlength="20">
      </div>
    </div>
    <button id="start-btn">¡Comenzar juego!</button>
  </div>

  <!-- JUEGO -->
  <div id="game-screen">
    <div class="app">
      <section class="board-area">
        <div class="board" id="board"></div>
      </section>

      <section class="panel">
        <h1># Tic Tac Toe #</h1>

        <div>
          <div class="section-label">Par de fichas</div>
          <div class="pair-options">
            <button class="pair-btn active" data-pair="0">
              <span class="icons">✖ ⭕</span>
              X / O
            </button>
            <button class="pair-btn" data-pair="1">
              <span class="icons">☀️ 🌙</span>
              Sol / Luna
            </button>
            <button class="pair-btn" data-pair="2">
              <span class="icons">❤️ 💎</span>
              ♥ / ♦
            </button>
          </div>
        </div>

        <div>
          <div class="section-label">Vista previa</div>
          <div class="preview">
            <div>
              <div class="pr" id="pv1">✖</div>
              <div class="pr-label" id="pv1-name">Jugador 1</div>
            </div>
            <div>
              <div class="pr" id="pv2">⭕</div>
              <div class="pr-label" id="pv2-name">Jugador 2</div>
            </div>
          </div>
        </div>

        <div class="color-section">
          <div class="section-label">Colores del tablero</div>
          <!-- Los colores ahora se definen por clases o CSS puro -->
          <div class="color-row">
            <span>Celda A</span>
            <div class="swatch active" data-target="clr1" data-color="#f7f7f7"></div>
            <div class="swatch" data-target="clr1" data-color="#ffe5e5"></div>
            <div class="swatch" data-target="clr1" data-color="#e5f0ff"></div>
            <div class="swatch" data-target="clr1" data-color="#e5ffe8"></div>
            <div class="swatch" data-target="clr1" data-color="#fff8e5"></div>
            <div class="swatch" data-target="clr1" data-color="#2a2f4a"></div>
          </div>
          <div class="color-row">
            <span>Celda B</span>
            <div class="swatch active" data-target="clr2" data-color="#c7d5f8"></div>
            <div class="swatch" data-target="clr2" data-color="#e4eaf8"></div>
            <div class="swatch" data-target="clr2" data-color="#ffd6d6"></div>
            <div class="swatch" data-target="clr2" data-color="#d6f5da"></div>
            <div class="swatch" data-target="clr2" data-color="#fdefc3"></div>
            <div class="swatch" data-target="clr2" data-color="#1a1f38"></div>
          </div>
          <div class="color-row">
            <span>Ganadora</span>
            <div class="swatch active" data-target="win" data-color="#ff4d4d"></div>
            <div class="swatch" data-target="win" data-color="#ff9f1c"></div>
            <div class="swatch" data-target="win" data-color="#2ec4b6"></div>
            <div class="swatch" data-target="win" data-color="#a855f7"></div>
            <div class="swatch" data-target="win" data-color="#22c55e"></div>
            <div class="swatch" data-target="win" data-color="#facc15"></div>
          </div>
        </div>

        <div class="status-grid">
          <div class="field"><span>Temporizador</span><strong id="timer">03:00</strong></div>
          <div class="field"><span>Estado</span><strong id="status">-</strong></div>
        </div>

        <div class="btn-row">
          <button id="reset">🔄 Reiniciar</button>
          <button id="change-names">✏️ Cambiar nombres</button>
        </div>
      </section>
    </div>
  </div>

  <div id="cat-overlay">
    <div class="cat-emoji">🐱</div>
    <div class="cat-title">¡Ganó el Gato!</div>
    <div class="cat-sub" id="cat-sub">Nadie pudo ganar esta vez</div>
    <button id="cat-close">Jugar de nuevo</button>
  </div>
  <script src="script.js"></script>
</body>

</html>
